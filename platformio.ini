; PlatformIO project for the contest firmware (src/competition/Robot_Competition).
; Build a test or another sketch instead by overriding the source folder, e.g.
;   Git Bash   : PLATFORMIO_SRC_DIR=src/tests/hardware/Test_LineSensor pio run -t upload
;   PowerShell : $env:PLATFORMIO_SRC_DIR="src/tests/hardware/Test_LineSensor"; pio run -t upload
;                (then: Remove-Item Env:PLATFORMIO_SRC_DIR)

[platformio]
src_dir = src/competition/Robot_Competition
default_envs = robot

[env:robot]
; pioarduino build of Arduino-ESP32 3.0.7
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Same flash layout as the Arduino IDE "ESP32S3 Dev Module" defaults (4MB, default.csv),
; so the NVS partition holding the tuned parameters stays at the same address.
board_upload.flash_size = 4MB
board_build.partitions = default.csv

lib_deps =
    adafruit/Adafruit_VL53L0X@^1.2.4
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit SSD1306@^2.5.13
    pololu/VL53L0X@^1.3.1

upload_speed = 921600
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
monitor_filters = esp32_exception_decoder
